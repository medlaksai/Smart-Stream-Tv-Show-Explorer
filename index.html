<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Stream</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>


</head>
<body class="bg-[#0B0F19] min-h-screen md:h-screen md:overflow-hidden">
    
    <div class="flex flex-col md:flex-row gap-2 w-full md:h-full">
    <aside class="flex shrink-0 w-full flex-col border-r border-gray-700 p-4  md:h-full md:w-72 gap-4 bg-[#111827] ">
            <h2 class="text-gray-50 font-bold text-xl px-4 m-2 text-shadow-md text-center">Smart Stream</h2>
        
        
          <span class="text-white">CATEGORIES</span>
<div id="category-container" class="flex flex-col gap-4 ">
        <div class=" border border-gray-700 p-2 rounded-lg hover:bg-gray-700 ">
            <div class="">
            <button data-category="Tout"  class="flex  w-full cursor-pointer">
                
                <span id="Tout" class="text-white whitespace-nowrap">Tout les chaînes</span>
                
            </button>
            </div>
        </div>

        <div class=" border border-gray-700 p-2 rounded-lg hover:bg-gray-700 ">
            <div class="">
            <button id="cat-actualites"data-category="Actualités"   class="grid grid-cols-3 w-full cursor-pointer">
                <span class="text-white ">Actualités</span>
                <div class="place-self-end">
                  <span></span>
                </div>
            </button>
            </div>
        </div>

        <div class=" border border-gray-700 p-2 rounded-lg hover:bg-gray-700">
            <div class="">
            <button id="cat-sports" data-category="Sports" class="grid grid-cols-3 w-full cursor-pointer">
                <span class="text-white ">Sports</span>
                <div class="place-self-end">
                  <span></span>
                </div>
            </button>
            </div>
        </div>

        <div class=" border border-gray-700 p-2 rounded-lg hover:bg-gray-700">
            <div class="">
            <button id="cat-documetaire" data-category="Documentaire" class="grid grid-cols-3 w-full cursor-pointer">
                <span class="text-white ">Documentaire</span>
                <div class="place-self-end">
                  <span></span>
                </div>
            </button>
            </div>
        </div>

        <div class=" border border-gray-700 p-2 rounded-lg hover:bg-gray-700">
            <div class="">
            <button id="cat-musique" data-category="Musique" class="grid grid-cols-3 w-full cursor-pointer">
                <span class="text-white ">Musique</span>
                <div class="place-self-end">
                  <span></span>
                </div>
            </button>
            </div>
        </div>

        <div class=" border border-gray-700 p-2 rounded-lg hover:bg-gray-700">
            <div class="">
            <button id="cat-enfant" data-category="Enfant" class="grid grid-cols-3 w-full cursor-pointer">
                <span class="text-white ">Enfant</span>
                <div class="place-self-end">
                  <span></span>
                </div>
            </button>
            </div>
        </div>

        
           <!-- <article class="grid grid-cols-[1fr_4fr] border border-red-600 rounded-xl p-2 hover:bg-red-500/20">
                <span class="text-gray-400">101</span>
                <div class="flex flex-rows gap-2 text-center">
                    <img src="" alt="sm" class="w-5 h-5 border border-white rounded-sm">
                <h4 class="font-bold text-white">Smart News</h4>
                </div>
            </article>
            -->
          
        </div>
    </aside>
    <section class="flex w-full shrink-0 flex-col gap-3 bg-[#111827] px-6 pt-4 md:h-full md:w-80">
      
      <header class="flex flex-col">
        <h2 class="text-[#94A3B8] text-center p-1">Liste des chaînes</h2>
        <p class="text-gray-400">Tout :  <span class="channels-total">  </span> Chaines</p>
      </header>
      <input id="filterInput" type="search" placeholder="Recherche TV en direct" class="border rounded-xl p-2 text-white bg-slate-800 h-9">
       <div id="error" class="hidden">
            <div class="flex flex-col gap-2 text-white">
                <p id="error-msg" class="text-red-500"></p>
                <button id="retry-button" class="bg-white text-black px-3 py-1 rounded cursor-pointer">Réessayer</button>
            </div>
        </div>
      <div id="channels-container" class="text-gray-400 pt-2 w-full flex flex-col gap-4 overflow-auto ">

        <!--
        <button id="btn-Channel" class="flex flex-rows shrink-0 gap-4 hover:bg-gray-700 w-full h-10 cursor-pointer hover:border hover:border-gray-700 rounded-lg p-1">
        <img src="" alt="" class="channel-logo w-8 rounded">
        <p class="channel-name">
        </p>
        </button>
        --> 
      </div>
      
    </section>
    <main class="border border-black w-full  bg-[#111827] rounded-xl m-7  p-2 flex flex-rows">
        <section class="p-2 w-full">
            <h3 class="rounded w-9 text-center  text-white m-1 absolute bg-red-500">Live</h3>
            <div class=" bg-black "> 
                <img class="live-image" src="" alt="" class="w-550 rounded">
            </div>
            <div class="text-center pt-2">
                <span id="channel-title" class="text-white font-bold "></span>
            </div>
            <div>
                <h4 id="playing-now" class="text-white"></h4>
                <p  id="playing-title" class="text-gray-400 "></p>
                <p  id="playing-hours"class="text-gray-400 font-thin"></p>
            </div>
        </section>
    </main>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
